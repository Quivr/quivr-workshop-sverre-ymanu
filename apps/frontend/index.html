<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />
    <title>Ask Quivr</title>
    <script>
      // Set the theme before first paint to avoid a light flash (keep in sync with theme.ts)
      try {
        var stored = localStorage.getItem('theme')
        var isDrunk = stored === 'drunk'
        var isDark =
          isDrunk ||
          stored === 'dark' ||
          (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', isDark)
        document.documentElement.classList.toggle('drunk', isDrunk)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
